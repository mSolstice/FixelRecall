name: Publish to npm

# Runs when a GitHub release is published. Publishing needs an npm automation token
# stored as the repository secret NPM_TOKEN (or switch to npm trusted publishing and
# delete the NODE_AUTH_TOKEN line). The release tag must match packages/cli/package.json,
# for example version 0.1.0 is released as tag v0.1.0.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm sign the provenance statement that links the package to this commit

jobs:
  publish:
    # fixel-recall is a macOS CLI, so verify and publish on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Release tag must match the package version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "Tag ${{ github.event.release.tag_name }} does not match package version v$version" >&2
            exit 1
          fi
      - name: Install the packed tarball in a clean environment
        run: pnpm smoke:npm
      - run: pnpm stage:npm
      - name: Publish with provenance
        working-directory: packages/cli/npm-package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
